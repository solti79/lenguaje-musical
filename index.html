<div id="contenedor-app">

    <!-- ==========================================
         MENÚ PRINCIPAL
         ========================================== -->

    <div id="menu-inicio">

        <h1>
            Fundamentos Básicos del Lenguaje Musical
        </h1>

        <div class="cuadros-container">

            <div
                class="tarjeta"
                onclick="intentarEntrar('Símbolos Musicales')"
            >

                <div class="icono">
                    𝄞
                </div>

                <span>
                    SÍMBOLOS MUSICALES
                </span>

            </div>


            <div
                class="tarjeta"
                onclick="intentarEntrar('Notas en el Pentagrama')"
            >

                </div>

                </span>

            </div>

        </div>

    </div>


    <!-- ==========================================

         ========================================== -->

    <div id="pantalla-actividad">

        <div class="header-actividad">

            <button
                class="btn-volver"
                onclick="volver()"
            >
                MENÚ
            </button>


            <select
                id="selector-nivel"
                onchange="ajustarTiempo()"
            >
            </select>

        </div>

            <h2 id="titulo-modulo"></h2>

            <p id="instrucciones-texto"></p>

            <button
                class="btn-inicio"
                onclick="comenzarActividad()"
            >
                COMENZAR
            </button>

        </div>

            <div
                class="cronometro"
                id="tiempo"
            >
                20
            </div>

                Aciertos: 0 | Errores: 0
            </div>

                ¡Incorrecto!
            </div>


            <div id="contenedor-pentagrama">

                <div id="pentagrama"></div>

                <div id="feedback-error">
                    ✘
                </div>

            </div>


            <div id="opciones"></div>

        </div>

    </div>

</div>


<script>

    /* ======================================================
       CONFIGURACIÓN GENERAL
       ====================================================== */

    const GOOGLE_URL =
        "https://script.google.com/macros/s/AKfycbzy5sc0_ijmg0Ch50LYrAzfKYaxuW5qHL_iBq3GaiLYkLmokIwRmMEFF5wh_vuYT60YPQ/exec";


    const NIVELES = [

        {
            nombre: "BÁSICO",
            tiempo: 20,
            opciones: 3
        },

        {
            nombre: "INTERMEDIO",
            tiempo: 12,
            opciones: 4
        },

        {
            nombre: "EXPERTO",
            tiempo: 8,
            opciones: 5
        }

    ];


    /* ======================================================
       SÍMBOLOS
       ====================================================== */

    const SIMBOLOS = [

        {
            id: "staff",
            nombre: "Pentagrama"
        },

        {
            id: "clef",
            nombre: "Clave de Sol"
        },

        {
            id: "measure",
            nombre: "Compás"
        },

        {
            id: "time44",
            nombre: "Compás 4/4"
        },

        {
            id: "barline",
            nombre: "Barra de compás"
        },

        {
            id: "doublebar",
            nombre: "Doble barra"
        },

        {
            id: "quarter",
            nombre: "Negra"
        },

        {
            id: "half",
            nombre: "Blanca"
        }

    ];


    /* ======================================================
       NOTAS
       ====================================================== */

    const NOTAS = [

        {
            id: "do",
            nombre: "Do"
        },

        {
            id: "re",
            nombre: "Re"
        },

        {
            id: "mi",
            nombre: "Mi"
        },

        {
            id: "fa",
            nombre: "Fa"
        },

        {
            id: "sol",
            nombre: "Sol"
        }

    ];


    /* ======================================================
       VARIABLES
       ====================================================== */

    let moduloActual = "";
    let nivelActual = 0;

    let tiempoRestante = 20;
    let timer = null;

    let aciertos = 0;
    let errores = 0;

    let respuestaCorrecta = "";

    let bloqueado = false;

    let logAciertos = [];
    let logErrores = [];


    /* ======================================================
       ENTRAR AL MÓDULO
       ====================================================== */

    function intentarEntrar(modulo) {

        moduloActual = modulo;

        const selector =
            document.getElementById("selector-nivel");

        selector.innerHTML = "";


        NIVELES.forEach(
            (nivel, index) => {

                const option =
                    document.createElement("option");

                option.value = index;

                option.textContent =
                    `${nivel.nombre} (${nivel.tiempo}s)`;

                selector.appendChild(option);
            }
        );


        if (
            modulo === "Símbolos Musicales"
        ) {

            document.getElementById(
                "instrucciones-texto"
            ).innerText =
                "Identifica los símbolos y elementos básicos del lenguaje musical. Responde tantas preguntas como puedas antes de que se termine el tiempo.";

        } else {

            document.getElementById(
                "instrucciones-texto"
            ).innerText =
                "Identifica las notas Do, Re, Mi, Fa y Sol en el pentagrama. Responde tantas preguntas como puedas antes de que se termine el tiempo.";

        }


        document.getElementById(
            "titulo-modulo"
        ).innerText = modulo;


        document.getElementById(
            "menu-inicio"
        ).style.display = "none";


        document.getElementById(
            "pantalla-actividad"
        ).style.display = "block";


        document.getElementById(
            "pantalla-previa"
        ).style.display = "block";


        document.getElementById(
            "area-juego"
        ).style.display = "none";


        ajustarTiempo();
    }


    /* ======================================================
       AJUSTAR TIEMPO
       ====================================================== */

    function ajustarTiempo() {

        nivelActual =
            parseInt(
                document.getElementById(
                    "selector-nivel"
                ).value || 0
            );


        tiempoRestante =
            NIVELES[nivelActual].tiempo;


        document.getElementById(
            "tiempo"
        ).innerText = tiempoRestante;
    }


    /* ======================================================
       COMENZAR
       ====================================================== */

    function comenzarActividad() {

        clearInterval(timer);

        aciertos = 0;
        errores = 0;

        logAciertos = [];
        logErrores = [];

        bloqueado = false;


        tiempoRestante =
            NIVELES[nivelActual].tiempo;


        document.getElementById(
            "pantalla-previa"
        ).style.display = "none";


        document.getElementById(
            "area-juego"
        ).style.display = "block";


        document.getElementById(
            "tiempo"
        ).innerText = tiempoRestante;


        actualizarContador();


        siguientePregunta();


        iniciarTimer();
    }


    /* ======================================================
       TEMPORIZADOR
       ====================================================== */

    function iniciarTimer() {

        clearInterval(timer);

        timer = setInterval(
            function() {

                tiempoRestante--;

                document.getElementById(
                    "tiempo"
                ).innerText =
                    tiempoRestante;


                if (
                    tiempoRestante <= 0
                ) {

                    clearInterval(timer);

                    finalizarYEnviar(
                        "Tiempo agotado"
                    );
                }

            },
            1000
        );
    }


    /* ======================================================
       SIGUIENTE PREGUNTA
       ====================================================== */

    function siguientePregunta() {

        if (
            tiempoRestante <= 0
        ) {
            return;
        }


        bloqueado = false;


        const pentagrama =
            document.getElementById(
                "pentagrama"
            );


        const opciones =
            document.getElementById(
                "opciones"
            );


        pentagrama.innerHTML = "";
        opciones.innerHTML = "";


        document.getElementById(
            "feedback-error"
        ).style.display = "none";


        document.getElementById(
            "mensaje-incorrecto"
        ).style.visibility = "hidden";


        if (
            moduloActual ===
            "Símbolos Musicales"
        ) {

            generarPreguntaSimbolo();

        } else {

            generarPreguntaNota();

        }
    }


    /* ======================================================
       PREGUNTA DE SÍMBOLOS
       ====================================================== */

    function generarPreguntaSimbolo() {

        const objetivo =
            SIMBOLOS[
                Math.floor(
                    Math.random() *
                    SIMBOLOS.length
                )
            ];


        respuestaCorrecta =
            objetivo.id;


        /*
           IMPORTANTE:
           Creamos primero los botones.
        */

        const opciones =
            document.getElementById(
                "opciones"
            );


        const cantidad =
            NIVELES[nivelActual].opciones;


        const candidatos =
            SIMBOLOS.filter(
                function(s) {
                    return s.id !== objetivo.id;
                }
            );


        mezclar(candidatos);


        let respuestas =
            [objetivo];


        respuestas =
            respuestas.concat(
                candidatos.slice(
                    0,
                    cantidad - 1
                )
            );


        mezclar(respuestas);


        respuestas.forEach(
            function(simbolo) {

                const boton =
                    document.createElement(
                        "button"
                    );


                boton.className =
                    "btn-respuesta";


                boton.innerText =
                    simbolo.nombre;


                boton.onclick =
                    function() {

                        verificarRespuesta(
                            simbolo.id,
                            boton,
                            simbolo.nombre
                        );

                    };


                opciones.appendChild(
                    boton
                );
            }
        );


        /*
           Después dibujamos el símbolo.
        */

        dibujarSimbolo(
            objetivo.id
        );


        actualizarContador();
    }


    /* ======================================================
       DIBUJAR SÍMBOLO
       ====================================================== */

    function dibujarSimbolo(id) {

        const contenedor =
            document.getElementById(
                "pentagrama"
            );


        /*
           PENTAGRAMA
        */

        if (id === "staff") {

            contenedor.innerHTML = `

                <div class="musica">

                    <div class="pregunta-musical">
                        ¿Qué elemento musical es?
                    </div>

                    <div class="staff">

                        <div class="linea linea1"></div>
                        <div class="linea linea2"></div>
                        <div class="linea linea3"></div>
                        <div class="linea linea4"></div>
                        <div class="linea linea5"></div>

                    </div>

                </div>
            `;

            return;
        }


        /*
           CLAVE DE SOL
        */

        if (id === "clef") {

            contenedor.innerHTML = `

                <div class="musica">

                    <div class="pregunta-musical">
                        ¿Qué símbolo musical es?
                    </div>

                    <div class="staff">

                        <div class="linea linea1"></div>
                        <div class="linea linea2"></div>
                        <div class="linea linea3"></div>
                        <div class="linea linea4"></div>
                        <div class="linea linea5"></div>

                        <div class="clave-sol">
                            𝄞
                        </div>

                    </div>

                </div>
            `;

            return;
        }


        /*
           COMPÁS
        */

        if (id === "measure") {

            contenedor.innerHTML = `

                <div class="musica">

                    <div class="pregunta-musical">
                        ¿Qué elemento musical es?
                    </div>

                    <div class="compas-visual">

                        <div class="linea linea1"></div>
                        <div class="linea linea2"></div>
                        <div class="linea linea3"></div>
                        <div class="linea linea4"></div>
                        <div class="linea linea5"></div>

                        <div class="barra-vertical barra-1"></div>
                        <div class="barra-vertical barra-2"></div>

                    </div>

                </div>
            `;

            return;
        }


        /*
           4/4
        */

        if (id === "time44") {

            contenedor.innerHTML = `

                <div class="musica">

                    <div class="pregunta-musical">
                        ¿Qué símbolo musical es?
                    </div>

                    <div class="compas-visual">

                        <div class="linea linea1"></div>
                        <div class="linea linea2"></div>
                        <div class="linea linea3"></div>
                        <div class="linea linea4"></div>
                        <div class="linea linea5"></div>

                        <div class="barra-vertical barra-1"></div>
                        <div class="barra-vertical barra-2"></div>

    /* ======================================================
       PREGUNTA DE NOTAS
       ====================================================== */

    function generarPreguntaNota() {

        const objetivo =
            NOTAS[
                Math.floor(
                    Math.random() *
                    NOTAS.length
                )
            ];


        respuestaCorrecta =
            objetivo.id;


        const opciones =
            document.getElementById(
                "opciones"
            );


        const cantidad =
            NIVELES[nivelActual].opciones;


        const candidatos =
            NOTAS.filter(
                function(n) {
                    return n.id !== objetivo.id;
                }
            );


        mezclar(candidatos);


        let respuestas =
            [objetivo];


        respuestas =
            respuestas.concat(
                candidatos.slice(
                    0,
                    cantidad - 1
                )
            );


        mezclar(respuestas);


        respuestas.forEach(
            function(nota) {

                const boton =
                    document.createElement(
                        "button"
                    );


                boton.className =
                    "btn-respuesta";


                boton.innerText =
                    nota.nombre;


                boton.onclick =
                    function() {

                        verificarRespuesta(
                            nota.id,
                            boton,
                            nota.nombre
                        );

                    };


                opciones.appendChild(
                    boton
                );
            }
        );


        dibujarNota(
            objetivo.id
        );


        actualizarContador();
    }


    /* ======================================================
       DIBUJAR NOTA EN PENTAGRAMA
       ====================================================== */

    function dibujarNota(id) {

        const posiciones = {

            do: {
                clase: "nota-do",
                linea: true
            },

            re: {
                clase: "nota-re",
                linea: false
            },

            mi: {
                clase: "nota-mi",
                linea: false
            },

            fa: {
                clase: "nota-fa",
                linea: false
            },

            sol: {
                clase: "nota-sol",
                linea: false
            }

        };


        const posicion =
            posiciones[id];


        const contenedor =
            document.getElementById(
                "pentagrama"
            );


        contenedor.innerHTML = `

            <div class="musica">

                <div class="pregunta-musical">

                </div>

                <div class="staff">

                        ?
                        '<div class="nota-con-linea linea-do"></div>'
                        :
                        ''
                    }

                </div>

            </div>
        `;
    }


    /* ======================================================
       VERIFICAR RESPUESTA
       ====================================================== */

    function verificarRespuesta(
        valor,
        boton,
        nombre
    ) {

        if (bloqueado) {
            return;
        }


        if (
            valor === respuestaCorrecta
        ) {

            aciertos++;

            logAciertos.push(
                nombre
            );

            actualizarContador();

            siguientePregunta();

        } else {

            errores++;

            logErrores.push(
                nombre
            );

            actualizarContador();

            mostrarError(
                boton
            );
        }
    }


    /* ======================================================
       ERROR
       ====================================================== */

    function mostrarError(boton) {

        bloqueado = true;


        document.getElementById(
            "feedback-error"
        ).style.display = "block";


        document.getElementById(
            "mensaje-incorrecto"
        ).style.visibility = "visible";


        if (boton) {
            boton.classList.add(
                "error"
            );
        }


        setTimeout(
            function() {

                document.getElementById(
                    "feedback-error"
                ).style.display = "none";


                document.getElementById(
                    "mensaje-incorrecto"
                ).style.visibility =
                    "hidden";


                if (boton) {
                    boton.classList.remove(
                        "error"
                    );
                }


                bloqueado = false;

            },
            900
        );
    }


    /* ======================================================
       CONTADOR
       ====================================================== */

    function actualizarContador() {

        document.getElementById(
            "contador"
        ).innerText =
            `Aciertos: ${aciertos} | Errores: ${errores}`;
    }


    /* ======================================================
       FINALIZAR
       ====================================================== */

    function finalizarYEnviar(
        estado
    ) {

        clearInterval(timer);

        bloqueado = true;


        const selector =
            document.getElementById(
                "selector-nivel"
            );

            selector.options[

            ].text;

            `Estado: ${estado}\n` +

        );


        const params =
            new URLSearchParams();


        params.append(
            "Fecha",
            new Date().toLocaleString()
        );


        params.append(
            "Alumno",
            ""
        );


        params.append(
            "Módulo",
            moduloActual
        );


        params.append(
            "Nivel",
            nivel
        );


        params.append(
            "Aciertos",
            aciertos
        );


        params.append(

        );


        params.append(
            "Estado",
            estado
        );


        params.append(
            "Log Aciertos",
            logAciertos.join(", ")
        );


        params.append(
            "Log Errores",
            logErrores.join(", ")
        );


        fetch(
            GOOGLE_URL,
            {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: params.toString()
            }
        ).catch(
            function() {}
        );


        volver();
    }


    /* ======================================================
       VOLVER
       ====================================================== */

    function volver() {

        clearInterval(timer);

        document.getElementById(
            "pantalla-actividad"
        ).style.display = "none";


        document.getElementById(
            "menu-inicio"
        ).style.display = "flex";


        document.getElementById(
            "pantalla-previa"
        ).style.display = "block";


        document.getElementById(
            "area-juego"
        ).style.display = "none";


        document.getElementById(
            "pentagrama"
        ).innerHTML = "";


        document.getElementById(
            "opciones"
        ).innerHTML = "";


        bloqueado = false;
    }


    /* ======================================================
       MEZCLAR
       ====================================================== */

    function mezclar(array) {

        for (
            let i = array.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );


            [
                array[i],
                array[j]
            ] =
            [
                array[j],
                array[i]
            ];
        }


        return array;
    }
