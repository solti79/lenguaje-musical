<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamentos Básicos del Lenguaje Musical</title>

<!-- VexFlow -->
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/vexflow-min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    #contenedor-app {
        background: white;
        width: 95%;
        max-width: 850px;
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
        position: relative;
    }

    h1 {
        color: #2c3e50;
        font-size: 2.2rem;
        margin-bottom: 35px;
    }

    h2 {
        color: #34495e;
    }

    /* =========================
       MENÚ PRINCIPAL
       ========================= */

    #menu-inicio {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    .cuadros-container {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        width: 100%;
        margin-top: 15px;
    }

    .tarjeta {
        background-color: #5dade2;
        color: white;
        width: 250px;
        height: 245px;
        border-radius: 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        text-decoration: none;
        padding: 15px;
        gap: 15px;
    }

    .tarjeta:hover {
        transform: translateY(-8px);
        background-color: #3498db;
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .icono {
        font-size: 85px;
        height: 115px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
    }

    .icono-clave {
        font-size: 105px !important;
        display: inline-block;
    }

    .tarjeta span {
        font-weight: bold;
        font-size: 1.35rem;
        color: white;
        margin: 0;
    }

    /* =========================
       PANTALLA DE ACTIVIDAD
       ========================= */

    #pantalla-actividad {
        display: none;
    }

    .header-actividad {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 15px;
    }

    .btn-volver,
    #selector-nivel {
        padding: 14px 22px;
        font-size: 1.05rem;
        font-weight: bold;
        border: 3px solid #3498db;
        border-radius: 12px;
        background-color: #ebf5fb;
        color: #2c3e50;
        cursor: pointer;
    }

    #selector-nivel {
        text-align: center;
    }

    #pantalla-previa {
        padding: 10px;
    }

    #instrucciones-texto {
        font-size: 1.25rem;
        color: #7f8c8d;
        margin: 20px auto 30px;
        max-width: 650px;
        line-height: 1.5;
    }

    .btn-inicio {
        background: #5dade2;
        color: white;
        border: none;
        padding: 20px 60px;
        border-radius: 15px;
        font-size: 1.7rem;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .btn-inicio:hover {
        background: #3498db;
        transform: scale(1.03);
    }

    /* =========================
       JUEGO
       ========================= */

    #area-juego {
        display: none;
    }

    .cronometro {
        font-size: 4rem;
        color: #e74c3c;
        font-weight: bold;
        line-height: 1;
        margin-bottom: 10px;
    }

    #contador {
        font-size: 1.35rem;
        font-weight: bold;
        margin: 10px;
        color: #2c3e50;
    }

    #mensaje-incorrecto {
        color: #e74c3c;
        font-size: 1.4rem;
        font-weight: bold;
        height: 30px;
        margin-bottom: 10px;
        visibility: hidden;
    }

    #contenedor-pentagrama {
        display: flex;
        justify-content: center;
        margin: 15px 0 20px;
        position: relative;
        width: 100%;
    }

    #pentagrama {
        background: #fff;
        border: 3px solid #3498db;
        border-radius: 20px;
        width: 100%;
        max-width: 650px;
        min-height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 10px;
    }

    #feedback-error {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 120px;
        color: #e74c3c;
        font-weight: bold;
        z-index: 10;
        pointer-events: none;
    }

    /* =========================
       BOTONES DE RESPUESTA
       ========================= */

    #opciones {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        max-width: 700px;
        margin: auto;
    }

    .btn-respuesta {
        background: #3498db;
        color: white;
        border: none;
        padding: 15px 25px;
        margin: 7px;
        border-radius: 12px;
        font-size: 1.1rem;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
        line-height: 1.2;
        min-width: 100px;
    }

    .btn-respuesta:hover {
        background: #2980b9;
        transform: translateY(-2px);
    }

    .btn-respuesta.error {
        background-color: #e74c3c !important;
    }

    /* =========================
       TEXTO DE PREGUNTA
       ========================= */

    .texto-pregunta {
        font-size: 1.25rem;
        color: #34495e;
        font-weight: bold;
        margin: 5px 0 15px;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 650px) {

        body {
            padding: 10px;
        }

        #contenedor-app {
            width: 100%;
            padding: 25px 15px;
            border-radius: 18px;
        }

        h1 {
            font-size: 1.7rem;
        }

        .tarjeta {
            width: 210px;
            height: 210px;
        }

        .icono {
            font-size: 70px;
            height: 90px;
        }

        .icono-clave {
            font-size: 85px !important;
        }

        .header-actividad {
            flex-direction: column;
        }

        .btn-volver,
        #selector-nivel {
            width: 100%;
        }

        .cronometro {
            font-size: 3.5rem;
        }

        #pentagrama {
            min-height: 190px;
        }

        .btn-respuesta {
            min-width: 90px;
            padding: 13px 18px;
            font-size: 1rem;
        }
    }
</style>
</head>

<body>

<div id="contenedor-app">

    <!-- =========================
         MENÚ PRINCIPAL
         ========================= -->

    <div id="menu-inicio">

        <h1>Fundamentos Básicos del Lenguaje Musical</h1>

        <div class="cuadros-container">

            <div class="tarjeta" onclick="intentarEntrar('Símbolos Musicales')">
                <div class="icono">𝄞</div>
                <span>SÍMBOLOS MUSICALES</span>
            </div>

            <div class="tarjeta" onclick="intentarEntrar('Notas en el Pentagrama')">
                <div class="icono">♫</div>
                <span>NOTAS EN EL PENTAGRAMA</span>
            </div>

        </div>
    </div>


    <!-- =========================
         PANTALLA DE ACTIVIDAD
         ========================= -->

    <div id="pantalla-actividad">

        <div class="header-actividad">

            <button class="btn-volver" onclick="volver()">
                MENÚ
            </button>

            <select id="selector-nivel" onchange="ajustarTiempo()">
            </select>

        </div>


        <!-- INTRODUCCIÓN -->

        <div id="pantalla-previa">

            <h2 id="titulo-modulo"></h2>

            <p id="instrucciones-texto"></p>

            <button class="btn-inicio" onclick="comenzarActividad()">
                COMENZAR
            </button>

        </div>


        <!-- JUEGO -->

        <div id="area-juego">

            <div class="cronometro" id="tiempo">
                20
            </div>

            <div id="contador">
                Aciertos: 0 | Errores: 0
            </div>

            <div id="mensaje-incorrecto">
                ¡Incorrecto!
            </div>

            <div id="contenedor-pentagrama">

                <div id="pentagrama"></div>

                <div id="feedback-error">
                    ✘
                </div>

            </div>

            <div id="opciones"></div>

        </div>

    </div>

</div>


<script>

    /* =========================================================
       CONFIGURACIÓN
       ========================================================= */

    const GOOGLE_URL =
        "https://script.google.com/macros/s/AKfycbzy5sc0_ijmg0Ch50LYrAzfKYaxuW5qHL_iBq3GaiLYkLmokIwRmMEFF5wh_vuYT60YPQ/exec";


    /*
       TIEMPOS DE LOS TRES NIVELES

       Beginner     = 20 segundos
       Intermediate = 12 segundos
       Expert       = 8 segundos
    */

    const NIVELES = [
        {
            nombre: "BÁSICO",
            tiempo: 20,
            opciones: 3
        },
        {
            nombre: "INTERMEDIO",
            tiempo: 12,
            opciones: 4
        },
        {
            nombre: "EXPERTO",
            tiempo: 8,
            opciones: 5
        }
    ];


    /* =========================================================
       VARIABLES DEL JUEGO
       ========================================================= */

    let moduloActual = "";
    let nivelActual = 0;

    let tiempoRestante = 20;
    let timer = null;

    let aciertos = 0;
    let errores = 0;

    let respuestaCorrecta = "";
    let bloqueado = false;

    let logAciertos = [];
    let logErrores = [];


    /* =========================================================
       MÓDULO 1 — SÍMBOLOS MUSICALES
       ========================================================= */

    const SIMBOLOS = [

        {
            id: "pentagrama",
            nombre: "Pentagrama",
            tipo: "staff"
        },

        {
            id: "clave",
            nombre: "Clave de Sol",
            tipo: "clef"
        },

        {
            id: "compas",
            nombre: "Compás",
            tipo: "measure"
        },

        {
            id: "compas44",
            nombre: "Compás 4/4",
            tipo: "time"
        },

        {
            id: "barra",
            nombre: "Barra de compás",
            tipo: "barline"
        },

        {
            id: "doblebarra",
            nombre: "Doble barra",
            tipo: "doublebar"
        },

        {
            id: "negra",
            nombre: "Negra",
            tipo: "quarter"
        },

        {
            id: "blanca",
            nombre: "Blanca",
            tipo: "half"
        }

    ];


    /*
       NOTA:
       "Compás" se representa visualmente como un pequeño
       fragmento de pentagrama delimitado por barras.
    */


    /* =========================================================
       MÓDULO 2 — NOTAS
       ========================================================= */

    const NOTAS = [

        {
            id: "c/4",
            nombre: "Do"
        },

        {
            id: "d/4",
            nombre: "Re"
        },

        {
            id: "e/4",
            nombre: "Mi"
        },

        {
            id: "f/4",
            nombre: "Fa"
        },

        {
            id: "g/4",
            nombre: "Sol"
        }

    ];


    /* =========================================================
       ENTRAR A UN MÓDULO
       ========================================================= */

    function intentarEntrar(modulo) {

        moduloActual = modulo;

        const selector =
            document.getElementById("selector-nivel");

        const instrucciones =
            document.getElementById("instrucciones-texto");

        selector.innerHTML = "";

        NIVELES.forEach((nivel, index) => {

            const option =
                document.createElement("option");

            option.value = index;

            option.textContent =
                `${nivel.nombre} (${nivel.tiempo}s)`;

            selector.appendChild(option);

        });


        if (modulo === "Símbolos Musicales") {

            instrucciones.innerText =
                "Identifica los símbolos y elementos básicos del lenguaje musical. Responde tantas preguntas como puedas antes de que se termine el tiempo.";

        } else {

            instrucciones.innerText =
                "Identifica las notas Do, Re, Mi, Fa y Sol en el pentagrama. Responde tantas preguntas como puedas antes de que se termine el tiempo.";

        }


        document.getElementById("menu-inicio")
            .style.display = "none";

        document.getElementById("pantalla-actividad")
            .style.display = "block";

        document.getElementById("pantalla-previa")
            .style.display = "block";

        document.getElementById("area-juego")
            .style.display = "none";

        document.getElementById("titulo-modulo")
            .innerText = modulo;

        ajustarTiempo();
    }


    /* =========================================================
       CAMBIAR NIVEL
       ========================================================= */

    function ajustarTiempo() {

        const index =
            parseInt(
                document.getElementById("selector-nivel").value || 0
            );

        nivelActual = index;

        tiempoRestante =
            NIVELES[index].tiempo;

        document.getElementById("tiempo")
            .innerText = tiempoRestante;
    }


    /* =========================================================
       COMENZAR
       ========================================================= */

    function comenzarActividad() {

        clearInterval(timer);

        const nivel =
            NIVELES[nivelActual];

        tiempoRestante =
            nivel.tiempo;

        aciertos = 0;
        errores = 0;

        bloqueado = false;

        logAciertos = [];
        logErrores = [];

        document.getElementById("pantalla-previa")
            .style.display = "none";

        document.getElementById("area-juego")
            .style.display = "block";

        document.getElementById("tiempo")
            .innerText = tiempoRestante;

        actualizarContador();

        siguientePregunta();

        iniciarTimer();
    }


    /* =========================================================
       TEMPORIZADOR
       ========================================================= */

    function iniciarTimer() {

        clearInterval(timer);

        timer = setInterval(() => {

            tiempoRestante--;

            document.getElementById("tiempo")
                .innerText = tiempoRestante;

            if (tiempoRestante <= 0) {

                clearInterval(timer);

                finalizarYEnviar("Tiempo agotado");
            }

        }, 1000);
    }


    /* =========================================================
       SIGUIENTE PREGUNTA
       ========================================================= */

    function siguientePregunta() {

        if (tiempoRestante <= 0) {
            return;
        }

        bloqueado = false;

        const pentagrama =
            document.getElementById("pentagrama");

        const opciones =
            document.getElementById("opciones");

        pentagrama.innerHTML = "";
        opciones.innerHTML = "";

        document.getElementById("feedback-error")
            .style.display = "none";

        document.getElementById("mensaje-incorrecto")
            .style.visibility = "hidden";


        if (moduloActual === "Símbolos Musicales") {

            generarPreguntaSimbolo();

        } else {

            generarPreguntaNota();

        }
    }


    /* =========================================================
       PREGUNTA DE SÍMBOLOS
       ========================================================= */

    function generarPreguntaSimbolo() {

        const objetivo =
            SIMBOLOS[
                Math.floor(
                    Math.random() * SIMBOLOS.length
                )
            ];

        respuestaCorrecta =
            objetivo.id;


        dibujarSimbolo(objetivo);


        const cantidad =
            NIVELES[nivelActual].opciones;

        const candidatos =
            SIMBOLOS.filter(
                s => s.id !== objetivo.id
            );


        mezclar(candidatos);


        let respuestas =
            [objetivo];

        respuestas =
            respuestas.concat(
                candidatos.slice(0, cantidad - 1)
            );

        mezclar(respuestas);


        respuestas.forEach(simbolo => {

            const boton =
                document.createElement("button");

            boton.className =
                "btn-respuesta";

            boton.innerText =
                simbolo.nombre;

            boton.onclick = () => {

                verificarRespuesta(
                    simbolo.id,
                    boton,
                    simbolo.nombre
                );

            };

            opciones.appendChild(boton);
        });


        actualizarContador();
    }


    /* =========================================================
       DIBUJAR SÍMBOLOS
       ========================================================= */

    function dibujarSimbolo(simbolo) {

        const contenedor =
            document.getElementById("pentagrama");

        /*
           VexFlow utiliza un SVG para representar
           el símbolo musical.
        */

        const ancho = 500;
        const alto = 180;

        const renderer =
            new Vex.Flow.Renderer(
                contenedor,
                Vex.Flow.Renderer.Backends.SVG
            );

        renderer.resize(ancho, alto);

        const ctx =
            renderer.getContext();


        /*
           STAFF
        */

        if (simbolo.tipo === "staff") {

            const stave =
                new Vex.Flow.Stave(
                    60,
                    55,
                    360
                );

            stave
                .setContext(ctx)
                .draw();

            return;
        }


        /*
           CLAVE DE SOL
        */

        if (simbolo.tipo === "clef") {

            const stave =
                new Vex.Flow.Stave(
                    60,
                    45,
                    360
                );

            stave
                .addClef("treble")
                .setContext(ctx)
                .draw();

            return;
        }


        /*
           COMPÁS
        */

        if (simbolo.tipo === "measure") {

            const stave =
                new Vex.Flow.Stave(
                    80,
                    55,
                    300
                );

            stave
                .addClef("treble")
                .setContext(ctx)
                .draw();

            return;
        }


        /*
           4/4
        */

        if (simbolo.tipo === "time") {

            const stave =
                new Vex.Flow.Stave(
                    80,
                    55,
                    300
                );

            stave
                .addClef("treble")
                .addTimeSignature("4/4")
                .setContext(ctx)
                .draw();

            return;
        }


        /*
           BARRA DE COMPÁS
        */

        if (simbolo.tipo === "barline") {

            const stave =
                new Vex.Flow.Stave(
                    80,
                    55,
                    300
                );

            stave
                .addClef("treble")
                .setContext(ctx)
                .draw();


            ctx.setLineWidth(4);

            ctx.beginPath();

            ctx.moveTo(280, 55);
            ctx.lineTo(280, 125);

            ctx.stroke();

            return;
        }


        /*
           DOBLE BARRA
        */

        if (simbolo.tipo === "doublebar") {

            const stave =
                new Vex.Flow.Stave(
                    80,
                    55,
                    300
                );

            stave
                .addClef("treble")
                .setContext(ctx)
                .draw();


            ctx.setLineWidth(3);

            ctx.beginPath();

            ctx.moveTo(270, 55);
            ctx.lineTo(270, 125);

            ctx.moveTo(280, 55);
            ctx.lineTo(280, 125);

            ctx.stroke();

            return;
        }


        /*
           NEGRA
        */

        if (simbolo.tipo === "quarter") {

            const stave =
                new Vex.Flow.Stave(
                    80,
                    55,
                    300
                );

            stave
                .addClef("treble")
                .setContext(ctx)
                .draw();


            const nota =
                new Vex.Flow.StaveNote({
                    keys: ["b/4"],
                    duration: "q"
                });


            Vex.Flow.Formatter
                .FormatAndDraw(
                    ctx,
                    stave,
                    [nota]
                );

            return;
        }


        /*
           BLANCA
        */

        if (simbolo.tipo === "half") {

            const stave =
                new Vex.Flow.Stave(
                    80,
                    55,
                    300
                );

            stave
                .addClef("treble")
                .setContext(ctx)
                .draw();


            const nota =
                new Vex.Flow.StaveNote({
                    keys: ["b/4"],
                    duration: "h"
                });


            Vex.Flow.Formatter
                .FormatAndDraw(
                    ctx,
                    stave,
                    [nota]
                );

            return;
        }
    }


    /* =========================================================
       PREGUNTA DE NOTAS
       ========================================================= */

    function generarPreguntaNota() {

        const objetivo =
            NOTAS[
                Math.floor(
                    Math.random() * NOTAS.length
                )
            ];

        respuestaCorrecta =
            objetivo.id;


        dibujarNota(objetivo.id);


        const cantidad =
            NIVELES[nivelActual].opciones;


        const candidatos =
            NOTAS.filter(
                n => n.id !== objetivo.id
            );

        mezclar(candidatos);


        let respuestas =
            [objetivo];

        respuestas =
            respuestas.concat(
                candidatos.slice(0, cantidad - 1)
            );

        mezclar(respuestas);


        respuestas.forEach(nota => {

            const boton =
                document.createElement("button");

            boton.className =
                "btn-respuesta";

            boton.innerText =
                nota.nombre;

            boton.onclick = () => {

                verificarRespuesta(
                    nota.id,
                    boton,
                    nota.nombre
                );

            };

            opciones.appendChild(boton);

        });


        actualizarContador();
    }


    /* =========================================================
       DIBUJAR NOTA
       ========================================================= */

    function dibujarNota(claveNota) {

        const contenedor =
            document.getElementById("pentagrama");

        const renderer =
            new Vex.Flow.Renderer(
                contenedor,
                Vex.Flow.Renderer.Backends.SVG
            );

        renderer.resize(500, 190);

        const ctx =
            renderer.getContext();


        const stave =
            new Vex.Flow.Stave(
                70,
                35,
                360
            );


        stave
            .addClef("treble")
            .setContext(ctx)
            .draw();


        const nota =
            new Vex.Flow.StaveNote({
                keys: [claveNota],
                duration: "q"
            });


        Vex.Flow.Formatter
            .FormatAndDraw(
                ctx,
                stave,
                [nota]
            );
    }


    /* =========================================================
       VERIFICAR RESPUESTA
       ========================================================= */

    function verificarRespuesta(
        valor,
        boton,
        nombre
    ) {

        if (bloqueado) {
            return;
        }


        if (valor === respuestaCorrecta) {

            aciertos++;

            logAciertos.push(nombre);

            actualizarContador();

            siguientePregunta();

        } else {

            errores++;

            logErrores.push(nombre);

            actualizarContador();

            mostrarError(boton);
        }
    }


    /* =========================================================
       ERROR
       ========================================================= */

    function mostrarError(boton) {

        bloqueado = true;

        const feedback =
            document.getElementById(
                "feedback-error"
            );

        const mensaje =
            document.getElementById(
                "mensaje-incorrecto"
            );


        feedback.style.display =
            "block";

        mensaje.style.visibility =
            "visible";


        if (boton) {
            boton.classList.add("error");
        }


        setTimeout(() => {

            feedback.style.display =
                "none";

            mensaje.style.visibility =
                "hidden";

            if (boton) {
                boton.classList.remove("error");
            }

            /*
               Después de un error, el estudiante
               permanece en la misma pregunta.
            */

            bloqueado = false;

        }, 900);
    }


    /* =========================================================
       CONTADOR
       ========================================================= */

    function actualizarContador() {

        document.getElementById("contador")
            .innerText =
                `Aciertos: ${aciertos} | Errores: ${errores}`;
    }


    /* =========================================================
       FINALIZAR
       ========================================================= */

    function finalizarYEnviar(estado) {

        clearInterval(timer);

        bloqueado = true;


        const selector =
            document.getElementById(
                "selector-nivel"
            );

        const nivel =
            selector.options[
                selector.selectedIndex
            ].text;


        alert(
            `¡Actividad terminada!\n\n` +
            `Estado: ${estado}\n` +
            `Aciertos: ${aciertos}\n` +
            `Errores: ${errores}`
        );


        /*
           Enviamos los resultados al Google Sheet.

           El campo Alumno se conserva vacío para que
           el sistema existente no se rompa, pero ya
           no se solicita ningún nombre.
        */

        const params =
            new URLSearchParams();


        params.append(
            "Fecha",
            new Date().toLocaleString()
        );

        params.append(
            "Alumno",
            ""
        );

        params.append(
            "Módulo",
            moduloActual
        );

        params.append(
            "Nivel",
            nivel
        );

        params.append(
            "Aciertos",
            aciertos
        );

        params.append(
            "Errores",
            errores
        );

        params.append(
            "Estado",
            estado
        );

        params.append(
            "Log Aciertos",
            logAciertos.join(", ")
        );

        params.append(
            "Log Errores",
            logErrores.join(", ")
        );


        fetch(GOOGLE_URL, {

            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body: params.toString()

        }).catch(() => {
            /*
               No detenemos el módulo si el envío
               de resultados falla.
            */
        });


        volver();
    }


    /* =========================================================
       VOLVER AL MENÚ
       ========================================================= */

    function volver() {

        clearInterval(timer);

        document.getElementById(
            "pantalla-actividad"
        ).style.display = "none";


        document.getElementById(
            "menu-inicio"
        ).style.display = "flex";


        document.getElementById(
            "pantalla-previa"
        ).style.display = "block";


        document.getElementById(
            "area-juego"
        ).style.display = "none";


        document.getElementById(
            "pentagrama"
        ).innerHTML = "";


        document.getElementById(
            "opciones"
        ).innerHTML = "";


        bloqueado = false;
    }


    /* =========================================================
       UTILIDAD — MEZCLAR ARRAY
       ========================================================= */

    function mezclar(array) {

        for (
            let i = array.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );

            [
                array[i],
                array[j]
            ] =
            [
                array[j],
                array[i]
            ];
        }

        return array;
    }

</script>
