<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selecciona una Actividad</title>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>

<style>

/* =========================================================
   ESTILOS GENERALES
========================================================= */

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f0f2f5;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

#contenedor-app {
    background: white;
    width: 95%;
    max-width: 850px;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    position: relative;
}

h1 {
    color: #2c3e50;
    font-size: 2.2rem;
    margin-bottom: 35px;
}


/* =========================================================
   MENÚ PRINCIPAL
========================================================= */

#menu-inicio {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.cuadros-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    width: 100%;
}

.tarjeta {
    background-color: #5dade2;
    color: white;
    width: 230px;
    height: 240px;
    border-radius: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    text-decoration: none;
    padding: 15px;
    gap: 12px;
}

.tarjeta:hover {
    transform: translateY(-8px);
    background-color: #3498db;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.icono {
    font-size: 85px;
    height: 115px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icono-clave {
    font-size: 105px;
    display: inline-block;
}

.tarjeta span {
    font-weight: bold;
    font-size: 1.35rem;
    color: white;
    margin: 0;
}


/* =========================================================
   PANTALLA DE ACTIVIDAD
========================================================= */

#pantalla-actividad {
    display: none;
}

.header-actividad {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.btn-volver,
#selector-nivel {
    padding: 13px 20px;
    font-size: 1rem;
    font-weight: bold;
    border: 3px solid #3498db;
    border-radius: 12px;
    background-color: #ebf5fb;
    color: #2c3e50;
    cursor: pointer;
}

#pantalla-previa {
    display: block;
}

#titulo-modulo {
    color: #34495e;
    font-size: 2rem;
}

#instrucciones-texto {
    font-size: 1.3rem;
    color: #7f8c8d;
    margin-bottom: 30px;
}

.btn-inicio {
    background: #5dade2;
    color: white;
    border: none;
    padding: 20px 60px;
    border-radius: 15px;
    font-size: 1.7rem;
    cursor: pointer;
    font-weight: bold;
}

.btn-inicio:hover {
    background: #3498db;
}


/* =========================================================
   JUEGO
========================================================= */

#area-juego {
    display: none;
}

.cronometro {
    font-size: 4rem;
    color: #e74c3c;
    font-weight: bold;
    line-height: 1;
    margin-bottom: 8px;
}

#contador {
    font-size: 1.35rem;
    font-weight: bold;
    margin: 10px;
    color: #2c3e50;
}

#mensaje-incorrecto {
    color: #e74c3c;
    font-size: 1.4rem;
    font-weight: bold;
    height: 30px;
    margin-bottom: 5px;
    visibility: hidden;
}


/* =========================================================
   CONTENEDOR DE LA ACTIVIDAD

   Importante:
   NO se coloca un segundo contenedor alrededor de VexFlow.
   El SVG de VexFlow se dibuja directamente dentro de
   #pentagrama, como en la versión original.
========================================================= */

#contenedor-pentagrama {
    display: flex;
    justify-content: center;
    margin: 15px 0;
    position: relative;
    width: 100%;
}

#pentagrama {
    background: #fff;
    border: 3px solid #3498db;
    border-radius: 20px;
    width: 100%;
    max-width: 650px;
    min-height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 10px;
    box-sizing: border-box;
}

#feedback-error {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px;
    color: #e74c3c;
    font-weight: bold;
    z-index: 10;
    pointer-events: none;
}


/* =========================================================
   IMÁGENES DE SÍMBOLOS

   Se conservan las proporciones originales.
========================================================= */

.simbolo-imagen {
    max-width: 90%;
    max-height: 160px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
}


/* =========================================================
   BOTONES DE RESPUESTA
========================================================= */

#opciones {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
}

.btn-respuesta {
    background: #3498db;
    color: white;
    border: none;
    padding: 15px 25px;
    margin: 6px;
    border-radius: 12px;
    font-size: 1.1rem;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
    line-height: 1.2;
    min-width: 85px;
}

.btn-respuesta:hover {
    background: #2980b9;
    transform: translateY(-2px);
}

.btn-respuesta.error {
    background-color: #e74c3c !important;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 650px) {

    #contenedor-app {
        padding: 20px;
    }

    h1 {
        font-size: 1.7rem;
    }

    .tarjeta {
        width: 210px;
        height: 210px;
    }

    .tarjeta .icono {
        font-size: 70px;
        height: 95px;
    }

    .header-actividad {
        flex-direction: column;
        gap: 12px;
    }

    .cronometro {
        font-size: 3rem;
    }

}

</style>

</head>

<body>

<div id="contenedor-app">

<!-- =====================================================
     MENÚ PRINCIPAL
===================================================== -->

<div id="menu-inicio">

```
<h1>
    Fundamentos Básicos del Lenguaje Musical
</h1>

<div class="cuadros-container">

    <div class="tarjeta"
         onclick="entrarModulo('Simbolos')">

        <div class="icono">
            𝄞
        </div>

        <span>
            SÍMBOLOS MUSICALES
        </span>

    </div>


    <div class="tarjeta"
         onclick="entrarModulo('Notas')">

        <div class="icono">
            ♩
        </div>

        <span>
            NOTAS MUSICALES
        </span>

    </div>

</div>
```

</div>

<!-- =====================================================
     PANTALLA DE ACTIVIDAD
===================================================== -->

<div id="pantalla-actividad">

```
<div class="header-actividad">

    <button
        class="btn-volver"
        onclick="volver()">

        ← MENÚ

    </button>


    <select id="selector-nivel">

        <option value="20">
            PRINCIPIANTE — 25 segundos
        </option>

        <option value="15">
            INTERMEDIO — 20 segundos
        </option>

        <option value="10">
            EXPERTO — 15 segundos
        </option>

    </select>

</div>



<div id="pantalla-previa">

    <h2 id="titulo-modulo"></h2>

    <p id="instrucciones-texto"></p>

    <button
        class="btn-inicio"
        onclick="comenzarActividad()">

        COMENZAR

    </button>

</div>



<div id="area-juego">

    <div class="cronometro"
         id="tiempo">

        20

    </div>


    <div id="contador">

        Aciertos: 0 | Errores: 0

    </div>


    <div id="mensaje-incorrecto">

        ¡Incorrecto!

    </div>


    <div id="contenedor-pentagrama">

        <div id="pentagrama"></div>

        <div id="feedback-error">
            ✘
        </div>

    </div>


    <div id="opciones"></div>

</div>
```

</div>

</div>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const GOOGLE_URL =
"https://script.google.com/macros/s/AKfycbzy5sc0_ijmg0Ch50LYrAzfKYaxuW5qHL_iBq3GaiLYkLmokIwRmMEFF5wh_vuYT60YPQ/exec";


/* =========================================================
   VARIABLES
========================================================= */

let moduloActual = "";

let tiempoRestante = 0;

let timer = null;

let notaActual = null;

let itemsRestantes = [];

let aciertos = 0;

let errores = 0;

let bloqueado = false;

let logAciertos = [];

let logErrores = [];


/* =========================================================
   LOS 8 SÍMBOLOS
========================================================= */

const SIMBOLOS = [

    {
        id: "pentagrama",
        nombre: "Pentagrama",
        imagen: "pentagrama.png"
    },

    {
        id: "clave",
        nombre: "Clave de Sol",
        imagen: "clavedesol.png"
    },

    {
        id: "cuatrocuatro",
        nombre: "4/4",
        imagen: "cuatrocuatro.png"
    },

    {
        id: "compas",
        nombre: "Compás",
        imagen: "compas.png"
    },

    {
        id: "barra",
        nombre: "Barra de compás",
        imagen: "barra.png"
    },

    {
        id: "doblebarra",
        nombre: "Doble barra",
        imagen: "doblebarra.png"
    },

    {
        id: "negra",
        nombre: "Negra",
        imagen: "negra.png"
    },

    {
        id: "blanca",
        nombre: "Blanca",
        imagen: "blanca.png"
    }

];


/* =========================================================
   LAS 5 NOTAS

   C4 = Do
   D4 = Re
   E4 = Mi
   F4 = Fa
   G4 = Sol
========================================================= */

const NOTAS = [

    {
        id: "c/4",
        nombre: "Do"
    },

    {
        id: "d/4",
        nombre: "Re"
    },

    {
        id: "e/4",
        nombre: "Mi"
    },

    {
        id: "f/4",
        nombre: "Fa"
    },

    {
        id: "g/4",
        nombre: "Sol"
    }

];


/* =========================================================
   ENTRAR AL MÓDULO
========================================================= */

function entrarModulo(modulo) {

    moduloActual = modulo;


    const titulo =
        document.getElementById(
            "titulo-modulo"
        );


    const instrucciones =
        document.getElementById(
            "instrucciones-texto"
        );


    if (modulo === "Simbolos") {

        titulo.innerText =
            "Módulo de Símbolos Musicales";

        instrucciones.innerText =
            "Identifica cada símbolo musical. Tendrás 4 opciones para cada pregunta.";

    }


    else if (modulo === "Notas") {

        titulo.innerText =
            "Módulo de Notas Musicales";

        instrucciones.innerText =
            "Identifica las notas Do, Re, Mi, Fa y Sol en el pentagrama.";

    }


    document.getElementById(
        "menu-inicio"
    ).style.display = "none";


    document.getElementById(
        "pantalla-actividad"
    ).style.display = "block";


    document.getElementById(
        "pantalla-previa"
    ).style.display = "block";


    document.getElementById(
        "area-juego"
    ).style.display = "none";

}


/* =========================================================
   COMENZAR ACTIVIDAD
========================================================= */

function comenzarActividad() {

    document.getElementById(
        "pantalla-previa"
    ).style.display = "none";


    document.getElementById(
        "area-juego"
    ).style.display = "block";


    aciertos = 0;

    errores = 0;

    bloqueado = false;

    logAciertos = [];

    logErrores = [];


    if (moduloActual === "Simbolos") {

        /*
           Los 8 símbolos aparecen una sola vez.
        */

        itemsRestantes =
            [...SIMBOLOS]
            .sort(
                () =>
                    Math.random() - 0.5
            );

    }


    else {

        /*
           Las 5 notas aparecen una sola vez.
        */

        itemsRestantes =
            [...NOTAS]
            .sort(
                () =>
                    Math.random() - 0.5
            );

    }


    tiempoRestante =
        parseInt(
            document.getElementById(
                "selector-nivel"
            ).value
        );


    document.getElementById(
        "tiempo"
    ).innerText =
        tiempoRestante;


    actualizarContador();


    siguientePregunta();


    iniciarTimer();

}


/* =========================================================
   SIGUIENTE PREGUNTA
========================================================= */

function siguientePregunta() {

    const pentagrama =
        document.getElementById(
            "pentagrama"
        );


    const opciones =
        document.getElementById(
            "opciones"
        );


    pentagrama.innerHTML = "";

    opciones.innerHTML = "";


    if (itemsRestantes.length === 0) {

        finalizarYEnviar(
            "Completado"
        );

        return;

    }


    const item =
        itemsRestantes.pop();


    notaActual =
        item.id;


    if (moduloActual === "Simbolos") {

        mostrarSimbolo(item);

        crearOpcionesSimbolos(item);

    }


    else {

        dibujarNota(item.id);

        crearOpcionesNotas();

    }


    actualizarContador();

}


/* =========================================================
   MOSTRAR SÍMBOLO
========================================================= */

function mostrarSimbolo(item) {

    const pentagrama =
        document.getElementById(
            "pentagrama"
        );


    const imagen =
        document.createElement(
            "img"
        );


    imagen.src =
        item.imagen;


    imagen.alt =
        item.nombre;


    imagen.className =
        "simbolo-imagen";


    pentagrama.appendChild(
        imagen
    );

}


/* =========================================================
   CREAR 4 OPCIONES PARA CADA SÍMBOLO
========================================================= */

function crearOpcionesSimbolos(
    respuestaCorrecta
) {

    const opciones =
        document.getElementById(
            "opciones"
        );


    /*
       La respuesta correcta siempre está incluida.
    */

    const incorrectas =
        SIMBOLOS
        .filter(
            item =>
                item.id !==
                respuestaCorrecta.id
        )
        .sort(
            () =>
                Math.random() - 0.5
        )
        .slice(0, 3);


    const respuestas = [

        respuestaCorrecta,

        ...incorrectas

    ]
    .sort(
        () =>
            Math.random() - 0.5
    );


    respuestas.forEach(
        item => {

            const boton =
                document.createElement(
                    "button"
                );


            boton.className =
                "btn-respuesta";


            boton.innerText =
                item.nombre;


            boton.onclick =
                function() {

                    verificarRespuesta(
                        item.id,
                        boton,
                        item.nombre
                    );

                };


            opciones.appendChild(
                boton
            );

        }
    );

}


/* =========================================================
   DIBUJAR NOTA

   ESTA FUNCIÓN VUELVE A LA ESTRUCTURA DEL CÓDIGO
   ORIGINAL DEL USUARIO.

   No se crea un contenedor VexFlow adicional.
========================================================= */

function dibujarNota(n) {

    const renderer =
        new Vex.Flow.Renderer(
            document.getElementById(
                "pentagrama"
            ),
            Vex.Flow.Renderer.Backends.SVG
        );


    renderer.resize(
        180,
        160
    );


    const ctx =
        renderer.getContext();


    const stave =
        new Vex.Flow.Stave(
            10,
            30,
            160
        );


    stave
        .addClef("treble")
        .setContext(ctx)
        .draw();


    const notes = [

        new Vex.Flow.StaveNote({

            keys: [n],

            duration: "q"

        })

    ];


    Vex.Flow.Formatter.FormatAndDraw(
        ctx,
        stave,
        notes
    );

}


/* =========================================================
   OPCIONES DE NOTAS
========================================================= */

function crearOpcionesNotas() {

    const opciones =
        document.getElementById(
            "opciones"
        );


    const respuestas =
        [...NOTAS]
        .sort(
            () =>
                Math.random() - 0.5
        );


    respuestas.forEach(
        item => {

            const boton =
                document.createElement(
                    "button"
                );


            boton.className =
                "btn-respuesta";


            boton.innerText =
                item.nombre;


            boton.onclick =
                function() {

                    verificarRespuesta(
                        item.id,
                        boton,
                        item.nombre
                    );

                };


            opciones.appendChild(
                boton
            );

        }
    );

}


/* =========================================================
   VERIFICAR RESPUESTA
========================================================= */

function verificarRespuesta(
    respuesta,
    boton,
    nombre
) {

    if (bloqueado) {

        return;

    }


    if (respuesta === notaActual) {

        aciertos++;

        logAciertos.push(
            nombre
        );


        siguientePregunta();

    }

    else {

        errores++;

        logErrores.push(
            nombre
        );


        mostrarError(
            boton
        );

    }


    actualizarContador();

}


/* =========================================================
   MOSTRAR ERROR
========================================================= */

function mostrarError(boton) {

    bloqueado = true;


    document.getElementById(
        "feedback-error"
    ).style.display =
        "block";


    document.getElementById(
        "mensaje-incorrecto"
    ).style.visibility =
        "visible";


    if (boton) {

        boton.classList.add(
            "error"
        );

    }


    setTimeout(
        function() {

            document.getElementById(
                "feedback-error"
            ).style.display =
                "none";


            document.getElementById(
                "mensaje-incorrecto"
            ).style.visibility =
                "hidden";


            if (boton) {

                boton.classList.remove(
                    "error"
                );

            }


            bloqueado = false;

        },
        900
    );

}


/* =========================================================
   CONTADOR
========================================================= */

function actualizarContador() {

    document.getElementById(
        "contador"
    ).innerText =
        "Aciertos: " +
        aciertos +
        " | Errores: " +
        errores;

}


/* =========================================================
   TEMPORIZADOR
========================================================= */

function iniciarTimer() {

    clearInterval(timer);


    timer =
        setInterval(
            function() {

                tiempoRestante--;


                document.getElementById(
                    "tiempo"
                ).innerText =
                    tiempoRestante;


                if (
                    tiempoRestante <= 0
                ) {

                    clearInterval(
                        timer
                    );


                    finalizarYEnviar(
                        "Tiempo agotado"
                    );

                }

            },
            1000
        );

}


/* =========================================================
   VOLVER AL MENÚ
========================================================= */

function volver() {

    clearInterval(timer);


    document.getElementById(
        "menu-inicio"
    ).style.display =
        "flex";


    document.getElementById(
        "pantalla-actividad"
    ).style.display =
        "none";


    document.getElementById(
        "pantalla-previa"
    ).style.display =
        "block";


    document.getElementById(
        "area-juego"
    ).style.display =
        "none";


    document.getElementById(
        "pentagrama"
    ).innerHTML =
        "";


    document.getElementById(
        "opciones"
    ).innerHTML =
        "";


    document.getElementById(
        "feedback-error"
    ).style.display =
        "none";


    document.getElementById(
        "mensaje-incorrecto"
    ).style.visibility =
        "hidden";

}


/* =========================================================
   FINALIZAR Y ENVIAR RESULTADOS
========================================================= */

function finalizarYEnviar(
    estado
) {

    clearInterval(timer);


    const selector =
        document.getElementById(
            "selector-nivel"
        );


    const nivel =
        selector.options[
            selector.selectedIndex
        ].text;


    alert(
        "¡Actividad terminada!\n\n" +
        "Estado: " +
        estado +
        "\n" +
        "Aciertos: " +
        aciertos +
        "\n" +
        "Errores: " +
        errores
    );


    const params =
        new URLSearchParams();


    params.append(
        "Fecha",
        new Date().toLocaleString()
    );


    params.append(
        "Módulo",
        moduloActual === "Simbolos"
            ? "Símbolos Musicales"
            : "Notas Musicales"
    );


    params.append(
        "Nivel",
        nivel
    );


    params.append(
        "Aciertos",
        aciertos
    );


    params.append(
        "Estado",
        estado
    );


    params.append(
        "Log Aciertos",
        logAciertos.join(", ")
    );


    params.append(
        "Log Errores",
        logErrores.join(", ")
    );


    fetch(
        GOOGLE_URL,
        {
            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body:
                params.toString()
        }
    );


    volver();

}

</script>

</body>
</html>
